name: build-toolchain

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # LLVM cross-build is heavy; ccache makes reruns fast
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake ccache

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('build.sh') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build
        run: ./build.sh

      - name: Acceptance test (compile + run under CSim shim)
        run: node test/acceptance.mjs

      - name: Report sizes
        run: ls -lh dist/ && gzip -k -9 dist/*.wasm dist/sysroot.tar && ls -lh dist/*.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csim-toolchain-dist
          path: dist/
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/clang.mjs
            dist/clang.wasm
            dist/lld.mjs
            dist/lld.wasm
            dist/sysroot.tar
            dist/VERSION
